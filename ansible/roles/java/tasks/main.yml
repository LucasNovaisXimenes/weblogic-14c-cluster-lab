---
- name: Instala dependências base
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - unzip
      - libc6-i386
    state: present
    update_cache: true

- name: Verifica se JDK já está instalado
  ansible.builtin.stat:
    path: /usr/lib/jvm/java-{{ jdk_major }}-openjdk-amd64/bin/java
  register: jdk_bin

- name: Instala OpenJDK 11 via apt
  ansible.builtin.apt:
    name: openjdk-11-jdk
    state: present
  when: not jdk_bin.stat.exists

- name: Configura JAVA_HOME no /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^JAVA_HOME='
    line: 'JAVA_HOME=/usr/lib/jvm/java-{{ jdk_major }}-openjdk-amd64'
    state: present

- name: Configura PATH com JAVA_HOME no /etc/profile.d/java.sh
  ansible.builtin.copy:
    dest: /etc/profile.d/java.sh
    content: |
      export JAVA_HOME=/usr/lib/jvm/java-{{ jdk_major }}-openjdk-amd64
      export PATH=$JAVA_HOME/bin:$PATH
    mode: '0644'

- name: Valida instalação do Java
  ansible.builtin.command: /usr/lib/jvm/java-{{ jdk_major }}-openjdk-amd64/bin/java -version
  changed_when: false
  register: java_version_out

- name: Exibe versão do Java
  ansible.builtin.debug:
    msg: "Java instalado: {{ java_version_out.stderr }}"
